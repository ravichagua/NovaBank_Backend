name: API - smoke test

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "API - pruebas"
    types:
      - completed

permissions:
  contents: read

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: production
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}

    steps:
      - name: Verificar endpoint de salud
        run: |
          test -n "$API_BASE_URL"
          curl --fail --silent --show-error --retry 20 --retry-delay 10 \
            --retry-max-time 240 \
            "$API_BASE_URL/health"

      - name: Verificar conexión con la base de datos
        run: |
          curl --fail --silent --show-error \
            "$API_BASE_URL/health/db"
